<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدردشة مع خدمة العملاء</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:        #2f5fe0;
    --blue-dark:   #24409e;
    --blue-light:  #eaf1ff;
    --blue-pale:   #f4f8ff;
    --ink:         #1c2340;
    --muted:       #7a84a6;
    --gray-bg:     #f0f2f8;
    --card-bg:     #ffffff;
    --mint:        #d9f5e6;
    --mint-ink:    #229a63;
    --radius-lg:   22px;
    --radius-md:   16px;
    --radius-sm:   12px;
    --shadow:      0 6px 18px rgba(47,95,224,0.08);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--gray-bg);
    font-family:'Tajawal', sans-serif;
    color:var(--ink);
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    max-width:480px;
    margin-inline:auto;
    overflow:hidden;
  }

  /* ==== شاشة إدخال الاسم (أول مرة فقط) ==== */
  #nameGate{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  #nameGate.hide{ display:none; }
  .gate-card{
    background:var(--card-bg);
    border-radius:var(--radius-lg);
    padding:30px 24px;
    box-shadow:var(--shadow);
    border-inline-end:6px solid var(--blue);
    width:100%;
    max-width:380px;
    text-align:center;
  }
  .gate-card .icon{ font-size:2.4rem; margin-bottom:10px; }
  .gate-card h1{ font-size:1.15rem; margin:0 0 6px; font-weight:900; }
  .gate-card p{ color:var(--muted); font-size:0.85rem; margin:0 0 20px; font-weight:500; }
  .gate-card input{
    width:100%;
    padding:14px;
    border-radius:var(--radius-sm);
    border:1.5px solid var(--blue-light);
    background:var(--blue-pale);
    font-family:'Tajawal', sans-serif;
    font-size:0.95rem;
    font-weight:600;
    color:var(--ink);
    margin-bottom:12px;
    outline:none;
  }
  .gate-card input:focus{ border-color:var(--blue); }
  .gate-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:var(--radius-md);
    background:var(--blue);
    color:#fff;
    font-family:'Tajawal', sans-serif;
    font-weight:800;
    font-size:0.95rem;
    cursor:pointer;
  }

  /* ==== شاشة الشات ==== */
  #chatScreen{ display:none; flex:1; flex-direction:column; min-height:0; }
  #chatScreen.show{ display:flex; }

  .chat-header{
    background:var(--card-bg);
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:var(--shadow);
    z-index:2;
  }
  .chat-header .avatar{
    width:42px; height:42px; border-radius:50%;
    background:var(--blue-light); color:var(--blue);
    display:flex; align-items:center; justify-content:center;
    font-size:1.3rem; flex-shrink:0;
  }
  .chat-header .info h2{ font-size:1rem; margin:0; font-weight:900; }
  .chat-header .info p{ font-size:0.78rem; color:var(--mint-ink); margin:2px 0 0; font-weight:700; display:flex; align-items:center; gap:5px; }
  .chat-header .info p .dot{ width:7px; height:7px; border-radius:50%; background:var(--mint-ink); }

  .messages{
    flex:1;
    overflow-y:auto;
    padding:18px 14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .msg{
    max-width:78%;
    padding:11px 15px;
    border-radius:18px;
    font-size:0.9rem;
    font-weight:500;
    line-height:1.6;
    word-break:break-word;
  }
  .msg.customer{
    align-self:flex-end;
    background:var(--blue);
    color:#fff;
    border-bottom-right-radius:5px;
  }
  .msg.admin{
    align-self:flex-start;
    background:var(--card-bg);
    color:var(--ink);
    box-shadow:var(--shadow);
    border-bottom-left-radius:5px;
  }
  .msg .time{
    display:block;
    font-size:0.68rem;
    opacity:0.7;
    margin-top:4px;
    font-weight:600;
  }
  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--muted);
    font-size:0.85rem;
    font-weight:600;
    padding:30px 20px;
  }
  .empty-state .icon{ font-size:2.2rem; margin-bottom:8px; }

  .composer{
    background:var(--card-bg);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom, 0px) + 18px);
    display:flex;
    gap:10px;
    align-items:flex-end;
    box-shadow:0 -4px 14px rgba(47,95,224,0.06);
    flex-shrink:0;
  }
  .composer textarea{
    flex:1;
    resize:none;
    border:1.5px solid var(--blue-light);
    background:var(--blue-pale);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    font-family:'Tajawal', sans-serif;
    font-size:0.9rem;
    font-weight:500;
    color:var(--ink);
    outline:none;
    max-height:100px;
    min-height:44px;
  }
  .composer textarea:focus{ border-color:var(--blue); }
  .send-btn{
    width:46px; height:46px; border-radius:50%;
    background:var(--blue); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center;
    font-size:1.2rem; cursor:pointer; flex-shrink:0;
  }
  .send-btn:active{ transform:scale(0.94); }
  .send-btn:disabled{ opacity:0.5; }
</style>
</head>
<body>

  <!-- شاشة إدخال الاسم أول مرة -->
  <div id="nameGate">
    <div class="gate-card">
      <div class="icon">💬</div>
      <h1>أهلًا بيك 👋</h1>
      <p>اكتب اسمك ورقم هاتفك عشان نقدر نتواصل معك ونرد عليك</p>
      <input type="text" id="custName" placeholder="الاسم الكامل">
      <input type="tel" id="custPhone" placeholder="رقم الهاتف (اختياري)">
      <button class="gate-btn" onclick="startChat()">بدء المحادثة</button>
    </div>
  </div>

  <!-- شاشة الشات -->
  <div id="chatScreen">
    <div class="chat-header">
      <div class="avatar">🎧</div>
      <div class="info">
        <h2>خدمة العملاء</h2>
        <p><span class="dot"></span> بنرد عليك بأقرب وقت</p>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="icon">👋</div>
        اكتب رسالتك وبنرد عليك بأقرب وقت
      </div>
    </div>

    <div class="composer">
      <textarea id="msgInput" placeholder="اكتب رسالتك..." rows="1" onkeydown="handleKeydown(event)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, setDoc, getDoc,
  query, orderBy, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDtj_AsssLYm7ZZpgFeUTqYNCrAUevOprs",
  authDomain: "the-chess-game-54a2c.firebaseapp.com",
  databaseURL: "https://the-chess-game-54a2c-default-rtdb.firebaseio.com",
  projectId: "the-chess-game-54a2c",
  storageBucket: "the-chess-game-54a2c.firebasestorage.app",
  messagingSenderId: "1012470944135",
  appId: "1:1012470944135:web:353bd44c8f5f7d8dcdc322",
  measurementId: "G-CFL72H1T3B"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CONV_KEY = "__support_conv_id__";
const NAME_KEY = "__support_cust_name__";
let convId = localStorage.getItem(CONV_KEY);
let unsubscribe = null;

window.startChat = async function(){
  const nameInput = document.getElementById("custName");
  const phoneInput = document.getElementById("custPhone");
  const name = nameInput.value.trim();
  const phone = phoneInput.value.trim();

  if(!name){
    nameInput.focus();
    nameInput.style.borderColor = "#d64d63";
    return;
  }

  localStorage.setItem(NAME_KEY, name);

  if(!convId){
    const convRef = await addDoc(collection(db, "conversations"), {
      customerName: name,
      customerPhone: phone || "",
      lastMessage: "",
      lastSender: "",
      lastTimestamp: serverTimestamp(),
      unread: false,
      createdAt: serverTimestamp()
    });
    convId = convRef.id;
    localStorage.setItem(CONV_KEY, convId);
  }

  document.getElementById("nameGate").classList.add("hide");
  document.getElementById("chatScreen").classList.add("show");
  listenToMessages();
};

function listenToMessages(){
  const q = query(collection(db, "conversations", convId, "messages"), orderBy("timestamp", "asc"));
  unsubscribe = onSnapshot(q, (snap) => {
    const box = document.getElementById("messages");
    const empty = document.getElementById("emptyState");
    if(snap.empty){
      if(empty) empty.style.display = "block";
      return;
    }
    if(empty) empty.style.display = "none";
    box.innerHTML = "";
    snap.forEach(docSnap => {
      const m = docSnap.data();
      const div = document.createElement("div");
      div.className = "msg " + (m.sender === "admin" ? "admin" : "customer");
      const time = m.timestamp && m.timestamp.toDate
        ? m.timestamp.toDate().toLocaleTimeString("ar-EG", {hour:"2-digit", minute:"2-digit"})
        : "";
      div.innerHTML = escapeHtml(m.text) + (time ? `<span class="time">${time}</span>` : "");
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  });
}

window.sendMessage = async function(){
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if(!text || !convId) return;

  const btn = document.getElementById("sendBtn");
  btn.disabled = true;
  input.value = "";
  autoResize(input);

  try{
    await addDoc(collection(db, "conversations", convId, "messages"), {
      sender: "customer",
      text: text,
      timestamp: serverTimestamp()
    });
    await setDoc(doc(db, "conversations", convId), {
      lastMessage: text,
      lastSender: "customer",
      lastTimestamp: serverTimestamp(),
      unread: true
    }, { merge: true });
  }catch(e){
    alert("صار خطأ أثناء إرسال الرسالة، حاول مرة ثانية");
  }
  btn.disabled = false;
};

window.handleKeydown = function(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
  autoResize(e.target);
};

function autoResize(el){
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 100) + "px";
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

/* لو المستخدم رجع بعد ما بدأ محادثة سابقًا، ندخله مباشرة عالشات */
window.addEventListener("DOMContentLoaded", () => {
  if(convId){
    document.getElementById("nameGate").classList.add("hide");
    document.getElementById("chatScreen").classList.add("show");
    listenToMessages();
  }
});
</script>

</body>
</html>
