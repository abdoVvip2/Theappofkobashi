<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة التلاميذ - كناشي Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc; --white: #ffffff;
            --blue: #2563eb; --green: #22c55e;
            --red: #ef4444; --orange: #f97316;
            --slate: #64748b; --dark: #0f172a;
            --radius: 18px;
        }

        * { font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1; box-sizing: border-box; }

        body {
            font-family: 'Cairo', "Segoe UI", sans-serif;
            background: var(--bg); margin: 0; padding: 15px;
            color: var(--dark); line-height: 1.5;
        }
        .app-wrapper { width: 100%; max-width: 460px; margin: 0 auto; padding-bottom: 110px; }

        /* ── top nav ── */
        .top-nav { display: flex; align-items: center; margin-bottom: 16px; gap: 14px; }
        .back-link {
            background: var(--white); border: none; width: 44px; height: 44px;
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); color: var(--dark);
            text-decoration: none; transition: 0.15s;
        }
        .back-link:active { transform: scale(0.9); }
        .top-nav h2 { margin: 0; font-size: 1.3rem; font-weight: 900; }

        /* ── search ── */
        .search-bar {
            background: var(--white); border-radius: 14px;
            padding: 11px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 20px; border: 1px solid #e8edf5;
        }
        .search-bar input {
            flex: 1; border: none; outline: none;
            font-size: 1rem; background: transparent;
            font-family: 'Cairo', inherit; color: var(--dark);
        }
        .search-bar i { color: var(--slate); }

        /* ── student card ── */
        .student-card {
            background: var(--white); padding: 18px 20px;
            border-radius: var(--radius); margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e8edf5;
            position: relative; overflow: hidden;
            transition: box-shadow 0.2s;
        }
        .student-card::before {
            content: ''; position: absolute;
            top: 0; right: 0; width: 4px; height: 100%;
            background: var(--green);
        }
        .student-card.has-debt::before { background: var(--red); }
        .student-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.10); }

        .info h4 { margin: 0; font-size: 1.1rem; font-weight: 900; }
        .info p  { margin: 6px 0 0; font-size: 0.88rem; color: var(--slate); display: flex; align-items: center; gap: 7px; }

        .debt-status {
            margin-top: 10px; display: inline-flex; align-items: center;
            padding: 4px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 700;
            font-variant-numeric: lining-nums;
        }
        .status-danger  { background: #fee2e2; color: #b91c1c; }
        .status-success { background: #dcfce7; color: #15803d; }

        .action-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(44px, 1fr));
            gap: 9px; margin-top: 16px;
            border-top: 1px solid #f1f5f9; padding-top: 14px;
        }
        .btn-op {
            height: 48px; border: none; border-radius: 13px;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; font-size: 1.1rem;
            transition: all 0.15s; text-decoration: none;
        }
        .btn-op:active { transform: translateY(2px); opacity: 0.8; }
        .btn-wa { background: #e8faf0; color: #16a34a; }
        .btn-ph { background: #eff6ff; color: #2563eb; }
        .btn-ar { background: #fff7ed; color: #c2410c; }
        .btn-ed { background: #f8fafc; color: #475569; border: 1px solid #f1f5f9; }
        .btn-dl { background: #fef2f2; color: #dc2626; }

        /* ── FAB ── */
        .fab {
            position: fixed; bottom: 28px; left: 24px;
            width: 62px; height: 62px;
            background: var(--blue); color: white;
            border-radius: 20px; border: none; font-size: 24px;
            box-shadow: 0 10px 24px rgba(37,99,235,0.4);
            cursor: pointer; z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .fab:active { transform: scale(0.88) rotate(90deg); }

        /* ── MODAL base ── */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(15,23,42,0.75); z-index: 2000;
            justify-content: center; align-items: center;
            backdrop-filter: blur(6px);
        }
        .modal-content {
            background: white; padding: 28px;
            border-radius: 26px; width: 92%; max-width: 390px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3);
            animation: mIn 0.2s ease;
        }
        @keyframes mIn {
            from { opacity:0; transform:translateY(18px) scale(0.97); }
            to   { opacity:1; transform:translateY(0) scale(1); }
        }
        .modal-content h3 { margin: 0 0 18px; text-align: center; font-size: 1.2rem; font-weight: 900; }

        .inp {
            width: 100%; padding: 13px 15px; margin-bottom: 12px;
            border: 2px solid #e8edf5; border-radius: 13px;
            font-size: 0.97rem; outline: none;
            transition: border-color 0.15s;
            font-family: 'Cairo', inherit;
        }
        .inp:focus { border-color: var(--blue); }

        .btn-submit {
            background: var(--blue); color: white; border: none;
            width: 100%; padding: 15px; border-radius: 14px;
            font-weight: 800; cursor: pointer; margin-top: 6px;
            font-size: 1rem; font-family: 'Cairo', inherit;
            box-shadow: 0 4px 12px rgba(37,99,235,0.25);
            transition: background 0.15s;
        }
        .btn-submit:hover { background: #1d4ed8; }

        .btn-cancel {
            width: 100%; background: none; border: none;
            margin-top: 12px; color: var(--slate); cursor: pointer;
            font-family: 'Cairo', inherit; font-size: 0.97rem;
            padding: 8px; border-radius: 10px; transition: background 0.15s;
        }
        .btn-cancel:hover { background: #f1f5f9; }

        /* ════════════════════════════
           ARCHIVE MODAL
        ════════════════════════════ */
        #archive-modal .modal-content {
            max-width: 460px; padding: 0;
            overflow: hidden;
        }

        .archive-top {
            background: var(--white);
            padding: 20px 22px 16px;
            border-bottom: 1px solid #f1f5f9;
            display: flex; justify-content: space-between; align-items: center;
        }
        .archive-top h3 { margin: 0; font-size: 1.1rem; font-weight: 900; }
        .btn-close-arch {
            background: #f1f5f9; border: none; width: 36px; height: 36px;
            border-radius: 10px; font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--slate); transition: background 0.15s;
        }
        .btn-close-arch:hover { background: #e2e8f0; }

        /* بطاقة ملخص */
        .arch-summary {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            gap: 0; border-bottom: 1px solid #f1f5f9;
        }
        .arch-summary-item {
            padding: 14px 10px; text-align: center;
            border-left: 1px solid #f1f5f9;
        }
        .arch-summary-item:last-child { border-left: none; }
        .arch-summary-item small {
            display: block; font-size: 0.72rem;
            color: var(--slate); font-weight: 700; margin-bottom: 4px;
        }
        .arch-summary-item b {
            font-size: 1.05rem; font-weight: 900;
            font-variant-numeric: lining-nums;
        }

        /* جسم الأرشيف */
        .arch-body { max-height: 55vh; overflow-y: auto; padding: 16px 16px 20px; }

        /* بطاقة دورة */
        .cycle-card {
            border: 1px solid #e2e8f0; border-radius: 14px;
            margin-bottom: 14px; overflow: hidden;
        }
        .cycle-header {
            background: #f8fafc; padding: 10px 14px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #e2e8f0;
        }
        .cycle-header span { font-weight: 800; font-size: 0.9rem; }
        .cycle-badge {
            font-size: 0.73rem; padding: 3px 10px;
            border-radius: 20px; font-weight: 700;
        }
        .badge-paid    { background: #dcfce7; color: #15803d; }
        .badge-debt    { background: #fee2e2; color: #b91c1c; font-variant-numeric: lining-nums; }
        .badge-partial { background: #fff7ed; color: #c2410c; font-variant-numeric: lining-nums; }
        .badge-free    { background: #fef9c3; color: #92400e; }

        /* شبكة الحصص */
        .sessions-grid {
            display: flex; flex-wrap: wrap;
            gap: 8px; padding: 12px 14px;
        }
        .sess-item {
            display: flex; flex-direction: column;
            align-items: center; gap: 3px;
        }
        .sess-box {
            width: 38px; height: 38px; border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 0.85rem;
            font-variant-numeric: lining-nums;
            border: 2px solid #e2e8f0; color: var(--slate);
            background: #f8fafc;
        }
        .sess-box.present     { background: var(--green); color: white; border-color: var(--green); }
        .sess-box.absent      { background: var(--red);   color: white; border-color: var(--red); }
        .sess-box.absent-free { background: var(--orange); color: white; border-color: var(--orange); }
        .sess-box.empty       { opacity: 0.4; }

        .sess-date { font-size: 0.6rem; color: var(--slate); text-align: center; max-width: 40px; }

        /* مؤشر طريقة الدفع للحصة */
        .sess-pay {
            font-size: 0.58rem; font-weight: 700;
            padding: 1px 4px; border-radius: 4px; margin-top: 1px;
        }
        .sess-pay.cash { background: #dcfce7; color: #15803d; }
        .sess-pay.debt { background: #fee2e2; color: #b91c1c; }
        .sess-pay.free { background: #fff7ed; color: #c2410c; }

        /* سجل الدفعات */
        .pay-log {
            border-top: 1px solid #f1f5f9;
            padding: 10px 14px 12px;
        }
        .pay-log-title { font-size: 0.78rem; color: var(--slate); font-weight: 700; margin-bottom: 8px; }
        .pay-entry {
            display: flex; justify-content: space-between;
            align-items: center; padding: 7px 0;
            border-bottom: 1px solid #f8fafc; font-size: 0.85rem;
        }
        .pay-entry:last-child { border-bottom: none; }
        .pay-amount { color: var(--green); font-weight: 800; font-variant-numeric: lining-nums; }

        /* empty state */
        .arch-empty { text-align: center; padding: 40px 20px; color: var(--slate); }
        .arch-empty i { font-size: 2.5rem; opacity: 0.35; margin-bottom: 10px; display: block; }

        .loading { text-align: center; padding: 40px; color: var(--slate); font-weight: 600; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="top-nav">
        <a href="home.html" class="back-link"><i class="fas fa-chevron-right"></i></a>
        <h2>قائمة التلاميذ</h2>
    </div>

    <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="ابحث عن تلميذ..." oninput="filterStudents()">
    </div>

    <div id="list"><div class="loading"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div></div>
</div>

<button class="fab" onclick="openModal()"><i class="fas fa-plus"></i></button>

<!-- ── مودال الإضافة/التعديل ── -->
<div id="modal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">إضافة تلميذ</h3>
        <input type="hidden" id="editId">
        <input type="text"   id="name"  class="inp" placeholder="الاسم الكامل">
        <input type="number" id="phone" class="inp" placeholder="رقم هاتف ولي الأمر (اختياري)">
        <select id="group" class="inp"></select>
        <button class="btn-submit" onclick="save()">💾 حفظ التلميذ</button>
        <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
    </div>
</div>

<!-- ══════════════════════════════
     مودال الأرشيف الكامل
══════════════════════════════ -->
<div id="archive-modal" class="modal">
    <div class="modal-content" style="max-width:460px; padding:0; overflow:hidden;">

        <div class="archive-top">
            <h3 id="arch-student-name">—</h3>
            <button class="btn-close-arch" onclick="closeArchive()">✕</button>
        </div>

        <!-- ملخص سريع -->
        <div class="arch-summary">
            <div class="arch-summary-item">
                <small>إجمالي الدفع</small>
                <b id="arch-paid" style="color:var(--green);">0 دج</b>
            </div>
            <div class="arch-summary-item">
                <small>الدين المتبقي</small>
                <b id="arch-debt" style="color:var(--red);">0 دج</b>
            </div>
            <div class="arch-summary-item">
                <small>الدورات</small>
                <b id="arch-cycles" style="color:var(--blue);">0</b>
            </div>
        </div>

        <!-- جسم الأرشيف -->
        <div class="arch-body" id="arch-body">
            <div class="arch-empty"><i class="fas fa-history"></i><p>لا يوجد سجل بعد</p></div>
        </div>
    </div>
</div>

<script>
// ══ أرقام لاتينية ══
function lat(v) { return String(v).replace(/[٠١٢٣٤٥٦٧٨٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)); }
function fmtMoney(v) { return lat(Number(v||0).toLocaleString('en-US')) + ' دج'; }

// ══ IndexedDB ══
const DB_NAME = "kanashi_db", DB_VERSION = 2;
const STORE_STUDENTS = "students", STORE_GROUPS = "groups";
let db = null;

function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains(STORE_STUDENTS)) {
                const s = d.createObjectStore(STORE_STUDENTS, { keyPath: "id" });
                s.createIndex("name",  "name",  { unique: false });
                s.createIndex("group", "group", { unique: false });
            }
            if (!d.objectStoreNames.contains(STORE_GROUPS)) {
                const gs = d.createObjectStore(STORE_GROUPS, { keyPath: "name" });
                gs.transaction.oncomplete = () => {
                    const tx = d.transaction(STORE_GROUPS, "readwrite");
                    ["فوج A","فوج B","فوج C"].forEach(g => tx.objectStore(STORE_GROUPS).add({ name: g }));
                };
            }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror   = (e) => reject(e.target.error);
    });
}

function getAllStudents() {
    return new Promise((res, rej) => {
        const tx = db.transaction(STORE_STUDENTS, "readonly");
        const req = tx.objectStore(STORE_STUDENTS).getAll();
        req.onsuccess = () => res(req.result);
        req.onerror   = () => rej(req.error);
    });
}
function getStudent(id) {
    return new Promise((res, rej) => {
        const tx = db.transaction(STORE_STUDENTS, "readonly");
        const req = tx.objectStore(STORE_STUDENTS).get(id);
        req.onsuccess = () => res(req.result);
        req.onerror   = () => rej(req.error);
    });
}
function putStudent(s) {
    return new Promise((res, rej) => {
        const tx = db.transaction(STORE_STUDENTS, "readwrite");
        const req = tx.objectStore(STORE_STUDENTS).put(s);
        req.onsuccess = () => res();
        req.onerror   = () => rej(req.error);
    });
}
function deleteStudent(id) {
    return new Promise((res, rej) => {
        const tx = db.transaction(STORE_STUDENTS, "readwrite");
        const req = tx.objectStore(STORE_STUDENTS).delete(id);
        req.onsuccess = () => res();
        req.onerror   = () => rej(req.error);
    });
}
function getAllGroups() {
    return new Promise((res, rej) => {
        const tx = db.transaction(STORE_GROUPS, "readonly");
        const req = tx.objectStore(STORE_GROUPS).getAll();
        req.onsuccess = () => res(req.result.map(g => g.name));
        req.onerror   = () => rej(req.error);
    });
}

// ══ modal إضافة / تعديل ══
async function populateGroups(selected = "") {
    const sel = document.getElementById("group");
    const groups = await getAllGroups();
    sel.innerHTML = '<option value="غير محدد">اختر الفوج</option>';
    groups.forEach(g => {
        const o = document.createElement("option");
        o.value = g; o.textContent = g;
        if (g === selected) o.selected = true;
        sel.appendChild(o);
    });
}

function openModal(id = null) {
    document.getElementById("modal").style.display = "flex";
    if (id) {
        getStudent(id).then(s => {
            document.getElementById("modalTitle").innerText = "تعديل البيانات";
            document.getElementById("editId").value  = s.id;
            document.getElementById("name").value    = s.name;
            document.getElementById("phone").value   = s.phone || "";
            populateGroups(s.group);
        });
    } else {
        document.getElementById("modalTitle").innerText = "إضافة تلميذ";
        ["editId","name","phone"].forEach(fid => document.getElementById(fid).value = "");
        populateGroups();
    }
}
function closeModal() { document.getElementById("modal").style.display = "none"; }

async function save() {
    const name  = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const group = document.getElementById("group").value;
    const editId = document.getElementById("editId").value;
    if (!name) { alert("الاسم مطلوب!"); return; }

    if (editId) {
        const s = await getStudent(Number(editId));
        await putStudent({ ...s, name, phone, group });
    } else {
        await putStudent({
            id: Date.now(), name, phone, group,
            paid: 0, debt: 0,
            registeredAt: Date.now(),
            attendance: [], dates: [],
            paymentMode: null,
            cycles: [],      // ← سجل الدورات المكتملة
            history: []
        });
    }
    closeModal();
    render();
}

async function removeStudent(id) {
    if (confirm("هل تريد حذف هذا التلميذ نهائياً؟")) {
        await deleteStudent(id);
        render();
    }
}

// ══════════════════════════════════════════════
//  الأرشيف الحقيقي
// ══════════════════════════════════════════════

/*
  بنية الدورة المخزّنة في s.cycles[] :
  {
    cycleNum   : 1,
    maxSessions: 4 | 8,
    paymentMode: "cash" | "debt",
    paidAmount : number,         // ما دُفع في هذه الدورة
    debtAmount : number,         // الدين المتبقي من هذه الدورة
    sessions   : [               // مصفوفة بحجم maxSessions
      { status: "present"|"absent"|"absent-free"|"", date: "12/5", pay: "cash"|"debt"|"free" }
    ],
    completedAt: timestamp | null
  }

  الدورة الحالية تُقرأ من s.attendance / s.dates / s.paymentMode مباشرة.
  عند الـ renewal يُضاف سجل الدورة المكتملة إلى s.cycles[].
  نظرًا لعدم وجود hook في ملف الحضور، نستخرج الدورة الحالية هنا من البيانات الخام.
*/

function buildCurrentCycle(s, groupMaxSessions) {
    const max  = groupMaxSessions || 4;
    const att  = s.attendance || [];
    const dt   = s.dates || [];
    const mode = s.paymentMode || null;

    // كل الحصص فارغة = لم تبدأ دورة
    const started = att.some(v => v !== "" && v !== undefined);
    if (!started) return null;

    const sessions = Array.from({ length: max }, (_, i) => {
        const st = att[i] || "";
        let pay = "";
        if (st === "absent-free") pay = "free";
        else if (st !== "")       pay = mode === "cash" ? "cash" : "debt";
        return { status: st, date: dt[i] || "", pay };
    });

    const sessionsCompleted = sessions.filter(s => s.status !== "").length;
    const paidPerSession = s.paidAmount_current || 0;

    return {
        cycleNum:    (s.cycles ? s.cycles.length : 0) + 1,
        maxSessions: max,
        paymentMode: mode,
        paidAmount:  mode === "cash" ? (s.groupPrice || 0) : 0,
        debtAmount:  mode === "debt" ? Number(s.debt || 0) : 0,
        sessions,
        sessionsCompleted,
        isCurrent: true
    };
}

function getCycleBadge(cycle) {
    if (!cycle.paymentMode) return { cls: "badge-free", txt: "غير محدد" };

    if (cycle.paymentMode === "cash") {
        return { cls: "badge-paid", txt: "دفع مسبق ✓" };
    }

    // debt
    if (cycle.debtAmount > 0) {
        return { cls: "badge-debt", txt: `دين: ${fmtMoney(cycle.debtAmount)}` };
    }
    return { cls: "badge-paid", txt: "تسوية ✓" };
}

function renderCycleCard(cycle, idx) {
    const badge = getCycleBadge(cycle);
    const label = cycle.isCurrent ? `الدورة ${lat(cycle.cycleNum)} (الحالية)` : `الدورة ${lat(cycle.cycleNum)}`;

    // صناديق الحصص
    const boxes = cycle.sessions.map((sess, i) => {
        let boxCls = "empty";
        if (sess.status === "present")     boxCls = "present";
        if (sess.status === "absent")      boxCls = "absent";
        if (sess.status === "absent-free") boxCls = "absent-free";

        let payLbl = "", payCls = "";
        if (sess.status !== "") {
            if (sess.pay === "cash")  { payLbl = "نقد"; payCls = "cash"; }
            if (sess.pay === "debt")  { payLbl = "دين"; payCls = "debt"; }
            if (sess.pay === "free")  { payLbl = "مجاني"; payCls = "free"; }
        }

        return `
        <div class="sess-item">
            <div class="sess-box ${boxCls}">${lat(i+1)}</div>
            ${sess.date ? `<div class="sess-date">${lat(sess.date)}</div>` : '<div class="sess-date"></div>'}
            ${payLbl ? `<div class="sess-pay ${payCls}">${payLbl}</div>` : '<div class="sess-pay"></div>'}
        </div>`;
    }).join("");

    // ملخص داخل الدورة
    const totalPresent     = cycle.sessions.filter(s => s.status === "present").length;
    const totalAbsent      = cycle.sessions.filter(s => s.status === "absent").length;
    const totalAbsentFree  = cycle.sessions.filter(s => s.status === "absent-free").length;
    const summaryParts = [];
    if (totalPresent    > 0) summaryParts.push(`<span style="color:var(--green);font-weight:700;">${lat(totalPresent)} حضور</span>`);
    if (totalAbsent     > 0) summaryParts.push(`<span style="color:var(--red);font-weight:700;">${lat(totalAbsent)} غياب</span>`);
    if (totalAbsentFree > 0) summaryParts.push(`<span style="color:var(--orange);font-weight:700;">${lat(totalAbsentFree)} غ°</span>`);

    return `
    <div class="cycle-card">
        <div class="cycle-header">
            <span>${label}</span>
            <span class="cycle-badge ${badge.cls}">${badge.txt}</span>
        </div>
        <div class="sessions-grid">${boxes}</div>
        ${summaryParts.length ? `<div style="padding: 0 14px 10px; font-size:0.82rem; display:flex; gap:12px; flex-wrap:wrap;">${summaryParts.join('')}</div>` : ''}
    </div>`;
}

async function openArchive(id) {
    const s = await getStudent(id);
    if (!s) return;

    // جلب الفوج لمعرفة maxSessions
    let maxSessions = 4;
    try {
        const tx = db.transaction(STORE_GROUPS, "readonly");
        const groups = await new Promise(res => tx.objectStore(STORE_GROUPS).getAll().onsuccess = e => res(e.target.result));
        const g = groups.find(g => g.name === s.group);
        if (g && g.sessionsCount) maxSessions = g.sessionsCount;
    } catch(e) {}

    document.getElementById("arch-student-name").innerText = s.name;
    document.getElementById("arch-paid").innerText = fmtMoney(s.paid);

    const debtEl = document.getElementById("arch-debt");
    debtEl.innerText = fmtMoney(s.debt);
    debtEl.style.color = Number(s.debt || 0) > 0 ? "var(--red)" : "var(--green)";

    // جمع كل الدورات
    const allCycles = [];

    // الدورات المحفوظة (المكتملة)
    if (s.cycles && s.cycles.length > 0) {
        s.cycles.forEach((c, i) => {
            allCycles.push({
                cycleNum: i + 1,
                maxSessions: c.maxSessions || maxSessions,
                paymentMode: c.paymentMode,
                paidAmount: c.paidAmount || 0,
                debtAmount: c.debtAmount || 0,
                sessions: c.sessions || [],
                isCurrent: false
            });
        });
    }

    // الدورة الحالية من attendance/dates
    const currentCycle = buildCurrentCycle(s, maxSessions);
    if (currentCycle) {
        currentCycle.cycleNum = allCycles.length + 1;
        allCycles.push(currentCycle);
    }

    document.getElementById("arch-cycles").innerText = lat(allCycles.length);

    const body = document.getElementById("arch-body");

    if (allCycles.length === 0) {
        body.innerHTML = `<div class="arch-empty"><i class="fas fa-history"></i><p>لم تبدأ أي دورة بعد</p></div>`;
    } else {
        // عرض من الأحدث للأقدم
        const reversed = [...allCycles].reverse();
        body.innerHTML = reversed.map((c, i) => renderCycleCard(c, i)).join("");
    }

    // سجل الدفعات إن وجد
    if (s.history && s.history.length > 0) {
        const payHTML = [...s.history].reverse().map(h => `
            <div class="pay-entry">
                <span style="color:var(--slate); font-size:0.82rem;">${new Date(h.date).toLocaleDateString('ar-DZ')} — ${h.note || 'دفعة نقدية'}</span>
                <span class="pay-amount">+${fmtMoney(h.amount)}</span>
            </div>`).join("");
        body.innerHTML += `
            <div class="pay-log">
                <div class="pay-log-title"><i class="fas fa-receipt" style="margin-left:5px;"></i> سجل الدفعات</div>
                ${payHTML}
            </div>`;
    }

    document.getElementById("archive-modal").style.display = "flex";
}

function closeArchive() { document.getElementById("archive-modal").style.display = "none"; }

// ══ البحث ══
async function filterStudents() {
    const term = document.getElementById("search-input").value.toLowerCase().trim();
    const all  = await getAllStudents();
    renderList(term ? all.filter(s => s.name.toLowerCase().includes(term)) : all);
}

// ══ رسم القائمة ══
function renderList(students) {
    const container = document.getElementById("list");
    if (!students.length) {
        container.innerHTML = `
            <div style="text-align:center; padding:70px 20px;">
                <i class="fas fa-user-slash" style="font-size:3.5rem; color:#cbd5e1; margin-bottom:14px; display:block;"></i>
                <p style="color:var(--slate); font-weight:600;">لا يوجد تلاميذ مضافين حالياً</p>
            </div>`;
        return;
    }

    const sorted = [...students].sort((a, b) => (b.debt||0) - (a.debt||0));
    container.innerHTML = sorted.map(s => {
        const isDebt = Number(s.debt||0) > 0;
        const debtStr = lat(s.debt||0);
        return `
        <div class="student-card ${isDebt ? 'has-debt' : ''}">
            <div class="card-header">
                <div class="info">
                    <h4>${s.name}</h4>
                    <p><i class="fas fa-users"></i> ${s.group}</p>
                    <div class="debt-status ${isDebt ? 'status-danger' : 'status-success'}">
                        ${isDebt ? `دين: ${debtStr} دج` : 'الحساب خالص ✓'}
                    </div>
                </div>
            </div>
            <div class="action-grid">
                ${s.phone ? `
                    <a href="https://wa.me/${s.phone}" class="btn-op btn-wa" title="واتساب"><i class="fab fa-whatsapp"></i></a>
                    <a href="tel:${s.phone}"           class="btn-op btn-ph" title="اتصال"><i class="fas fa-phone-alt"></i></a>` : ''}
                <button class="btn-op btn-ar" onclick="openArchive(${s.id})" title="الأرشيف"><i class="fas fa-history"></i></button>
                <button class="btn-op btn-ed" onclick="openModal(${s.id})"   title="تعديل"><i class="fas fa-user-edit"></i></button>
                <button class="btn-op btn-dl" onclick="removeStudent(${s.id})" title="حذف"><i class="fas fa-trash-alt"></i></button>
            </div>
        </div>`;
    }).join("");
}

async function render() {
    const students = await getAllStudents();
    renderList(students);
}

openDB().then(() => render()).catch(err => {
    document.getElementById("list").innerHTML =
        `<div class="loading" style="color:var(--red);">خطأ في قاعدة البيانات: ${err.message}</div>`;
});
</script>
